openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /news/{ticker}:
    get:
      summary: Get News By Ticker
      operationId: get_news_by_ticker_news__ticker__get
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            title: Ticker
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverallNewsItem"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /news:
    get:
      summary: All Articles
      operationId: all_articles_news_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/NewsItem"
                type: array
                title: Response All Articles News Get
  /:
    get:
      summary: Root
      description: API information
      operationId: root__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health
      description: Health check endpoint
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NewsItem:
      properties:
        title:
          type: string
          title: Title
        summary:
          type: string
          title: Summary
        signals:
          items:
            $ref: "#/components/schemas/Signal"
          type: array
          title: Signals
        description:
          type: string
          title: Description
        published_at:
          type: string
          format: date-time
          title: Published At
        since_published_hr:
          type: number
          title: Since Published Hr
        source:
          type: string
          title: Source
        url:
          type: string
          title: Url
      type: object
      required:
        - title
        - summary
        - description
        - published_at
        - since_published_hr
        - source
        - url
      title: NewsItem
    OverallNewsItem:
      properties:
        ticker:
          type: string
          title: Ticker
        overall_sentiment:
          type: string
          title: Overall Sentiment
        overall_sentiment_score:
          type: number
          title: Overall Sentiment Score
        overall_confidence:
          type: number
          title: Overall Confidence
        sentiment_momentum:
          type: string
          title: Sentiment Momentum
        articles_analysed:
          type: integer
          title: Articles Analysed
        summary:
          type: string
          title: Summary
        signals:
          items:
            $ref: "#/components/schemas/NewsItem"
          type: array
          title: Signals
      type: object
      required:
        - ticker
        - overall_sentiment
        - overall_sentiment_score
        - overall_confidence
        - sentiment_momentum
        - articles_analysed
        - summary
        - signals
      title: OverallNewsItem
    Signal:
      properties:
        asset:
          type: string
          title: Asset
        signal_score:
          type: number
          title: Signal Score
      type: object
      required:
        - asset
        - signal_score
      title: Signal
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
